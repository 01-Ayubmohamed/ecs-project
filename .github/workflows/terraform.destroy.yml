name: Terraform destroy Pipeline


on: 
    workflow_dispatch: 
        inputs:
            confirm:
                description: 'Type "yes" to confirm the destroy action'
                required: true
                default: 'no'

concurrency:
    group: terraform-destroy
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

jobs: 
    destroy: 
        name: Terraform Destroy
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./infra
        steps:
            - name: Verify Confirmation
              working-directory: .
              env:
                CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
              run: |
                if [ "$CONFIRM_INPUT" != "yes" ]; then
                  echo "Destroy action failed to confirm with 'yes'. Aborting."
                  exit 1
                fi

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
              with:
                  role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
              with:
                  terraform_version: "~1.15.0"

            - name: Terraform Init
              run: terraform init



            - name: Terraform plan
              run: terraform plan -destroy -out=tfplan

            - name: Terraform Destroy
              run: terraform apply -auto-approve tfplan