
name: Terraform Pipeline


on: 
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

concurrency:
    group: terraform
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read
jobs:
        plan: 
            name: Terraform Plan
            runs-on: ubuntu-latest
            defaults:
                run:
                    working-directory: ./infra

            steps:
                - name: Checkout repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 

                - name: Configure AWS credentials (OIDC)
                  uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
                  with:
                      role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
                      aws-region: ${{ vars.AWS_REGION }}


                

                - name: Set up Terraform
                  uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
                  with:
                      terraform_version: "~1.15.0"

                - name: Terraform Init
                  run: terraform init

                - name: Terraform Format
                  run: terraform fmt -check
                
                - name: Terraform Validate
                  run: terraform validate


                - name: Setup TFlint 
                  uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
                  with:
                      tflint_version: v0.64.0


                - name: Terraform TFLint
                  run: tflint --init && tflint

                - name: Security Scan 
                  uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d
                  with:
                    directory: ${{ github.workspace }}
                    soft_fail: true

                - name: Terraform Plan
                  run: terraform plan -out=tfplan
                
                - name: Upload Terraform Plan
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                      name: tfplan
                      path: ./infra/tfplan

        apply:
            name: Terraform Apply
            runs-on: ubuntu-latest
            defaults:
                run:
                    working-directory: ./infra
            if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            needs: plan

            steps:
                - name: Checkout repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

                - name: Configure AWS credentials (OIDC)
                  uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
                  with:
                      role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
                      aws-region: ${{ vars.AWS_REGION }}

                - name: Set up Terraform
                  uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
                  with:
                      terraform_version: "~1.15.0"

                - name: Terraform Init
                  run: terraform init

                - name: Download Terraform Plan
                  uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
                  with:
                      name: tfplan
                      path: infra

                - name: Terraform Apply
                  run: terraform apply -auto-approve tfplan





